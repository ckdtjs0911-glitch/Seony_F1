name: Fill historical report gaps
on:
  schedule:
    - cron: '43 18 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekend-report
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.4
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Collect missing historical reports (rolling three years)
        env:
          OPENF1_CLIENT_ID: ${{ secrets.OPENF1_CLIENT_ID }}
          OPENF1_CLIENT_SECRET: ${{ secrets.OPENF1_CLIENT_SECRET }}
        run: python tools/backfill_reports.py --refresh-catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-f1-reports
          path: reports/
          retention-days: 30
      - name: Save cumulative reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- reports
          if ! git diff --cached --quiet; then
            git commit -m 'Fill historical F1 report gaps'
            git push
          fi
