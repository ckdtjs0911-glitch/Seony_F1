name: Claude report reviews

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      CLAUDE_REVIEW_ENABLED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: reports
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: env.CLAUDE_REVIEW_ENABLED == 'true'
        with:
          node-version: '22'
      - name: Install Claude Code CLI
        if: env.CLAUDE_REVIEW_ENABLED == 'true'
        continue-on-error: true
        run: npm install --global @anthropic-ai/claude-code@2.1.319
      - name: Review and adversarial review (read only)
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python tools/claude_report_review.py --output-dir "$RUNNER_TEMP/claude-report-review"
      - name: Save both reviews and authentication status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/claude-report-review/
          if-no-files-found: warn
          retention-days: 30
