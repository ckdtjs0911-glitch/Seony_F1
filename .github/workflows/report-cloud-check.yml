name: F1 cloud readiness check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/report-cloud-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.4
      - name: Check restart gate without collecting F1 data
        run: |
          python -m unittest discover -s tools -p test_session_report_schedule.py
          python tools/session_report_schedule.py
      - name: Check whether cloud credentials are configured (values are never printed)
        id: credentials
        env:
          CLAUDE_CONFIGURED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          OPENF1_ID_CONFIGURED: ${{ secrets.OPENF1_CLIENT_ID != '' }}
          OPENF1_SECRET_CONFIGURED: ${{ secrets.OPENF1_CLIENT_SECRET != '' }}
        run: |
          echo "claude=$CLAUDE_CONFIGURED" >> "$GITHUB_OUTPUT"
          {
            echo '## 클라우드 준비 상태'
            echo "Claude 인증 설정: $CLAUDE_CONFIGURED"
            echo "OpenF1 client ID 설정: $OPENF1_ID_CONFIGURED"
            echo "OpenF1 client secret 설정: $OPENF1_SECRET_CONFIGURED"
            echo 'OpenF1 설정 유무는 데이터 접근 성공을 뜻하지 않습니다. 데이터 API는 이 점검에서 호출하지 않습니다.'
            echo 'FastF1 상세 데이터 인증은 별도이며 이 점검에서 확인하지 않습니다.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.claude == 'true'
        with:
          node-version: '22'
      - name: Install Claude Code for the cloud connection check
        if: steps.credentials.outputs.claude == 'true'
        run: npm install --global @anthropic-ai/claude-code@2.1.319
      - name: Verify Claude authentication without report generation
        if: steps.credentials.outputs.claude == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        working-directory: ${{ runner.temp }}
        run: |
          if claude --print --max-turns 1 --tools '' -- 'Reply with exactly CONNECTED.' > claude-connection.txt 2> claude-connection-error.txt; then
            echo 'Claude 실제 호출: 성공' >> "$GITHUB_STEP_SUMMARY"
          else
            python - <<'PY'
          import os
          from pathlib import Path
          detail = '\n'.join(Path(p).read_text(errors='replace') for p in ('claude-connection.txt', 'claude-connection-error.txt')).lower()
          reason = '인증·계정·통신 오류 (원문에 인증 정보가 있을 수 있어 공개하지 않음)'
          for needles, label in [
              (('expired',), '인증 만료'),
              (('invalid api key', 'invalid token', '401', 'authentication_error', 'not logged in'), '인증 거부'),
              (('credit balance', 'usage limit', 'rate limit', '429'), '사용 한도 또는 크레딧'),
              (('unknown option', 'requires an argument', 'no prompt', 'input must be provided'), 'CLI 인수 오류'),
              (('403', 'permission denied'), '접근 권한 거부'),
          ]:
              if any(n in detail for n in needles):
                  reason = label
                  break
          message = 'Claude 실제 호출: 실패 · ' + reason
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(message + '\n')
          PY
            exit 1
          fi
