name: F1 weekend reports

on:
  schedule:
    # Every six hours, offset from the busiest minute. UTC.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      meeting:
        description: 'Optional OpenF1 meeting_key (blank = latest started weekend)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekend-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.4
      - name: Verify report generation and failure handling
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Collect five sessions and build report
        env:
          MEETING: ${{ inputs.meeting }}
          OPENF1_CLIENT_ID: ${{ secrets.OPENF1_CLIENT_ID }}
          OPENF1_CLIENT_SECRET: ${{ secrets.OPENF1_CLIENT_SECRET }}
        run: |
          args=()
          if [ -n "$MEETING" ]; then
            if ! [[ "$MEETING" =~ ^[0-9]+$ ]]; then
              echo 'meeting must be a numeric OpenF1 meeting_key'
              exit 1
            fi
            args+=(--meeting "$MEETING")
          fi
          python tools/weekend_report.py --output-root .report-staging "${args[@]}"
      - name: Optional AI review (base reports work without API keys)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_CODEX_MODEL: ${{ vars.REPORT_CODEX_MODEL }}
          REPORT_CLAUDE_MODEL: ${{ vars.REPORT_CLAUDE_MODEL }}
        run: python tools/review_pipeline.py --staging .report-staging --destination reports --optional
      - name: Update cumulative year, Grand Prix and session archive
        run: python tools/build_archive.py
      - name: Retain reports and snapshots for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-weekend-reports
          path: |
            reports/weekend-*/
            reports/index.html
            reports/catalog/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit successfully generated reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update F1 weekend reports'
            git push
          fi
