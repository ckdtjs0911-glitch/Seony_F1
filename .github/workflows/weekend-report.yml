name: F1 weekend reports

on:
  # Scheduled reports paused until 2026-11-28 00:00 Asia/Seoul.
  # Resume cron: 7,22,37,52 * * * *
  workflow_dispatch:
    inputs:
      meeting:
        description: 'Optional OpenF1 meeting_key (blank = latest started weekend)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  report:
    outputs:
      source_sha: ${{ steps.report_commit.outputs.sha }}
      generated: ${{ steps.collection.outputs.collected }}
    concurrency:
      group: weekend-report
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.4
      - name: Check for a completed session needing a report
        id: session_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          MEETING: ${{ inputs.meeting }}
          OPENF1_CLIENT_ID: ${{ secrets.OPENF1_CLIENT_ID }}
          OPENF1_CLIENT_SECRET: ${{ secrets.OPENF1_CLIENT_SECRET }}
        run: |
          args=()
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            args+=(--manual)
            if [ -n "$MEETING" ]; then
              [[ "$MEETING" =~ ^[0-9]+$ ]] || exit 1
              args+=(--meeting "$MEETING")
            fi
          fi
          python tools/session_report_schedule.py "${args[@]}"
      - name: Verify report generation and failure handling
        if: steps.session_gate.outputs.run == 'true'
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Collect five sessions and build report
        id: collection
        if: steps.session_gate.outputs.run == 'true'
        env:
          MEETING: ${{ steps.session_gate.outputs.meeting }}
          OPENF1_CLIENT_ID: ${{ secrets.OPENF1_CLIENT_ID }}
          OPENF1_CLIENT_SECRET: ${{ secrets.OPENF1_CLIENT_SECRET }}
        run: |
          args=()
          if [ -n "$MEETING" ]; then
            if ! [[ "$MEETING" =~ ^[0-9]+$ ]]; then
              echo 'meeting must be a numeric OpenF1 meeting_key'
              exit 1
            fi
            args+=(--meeting "$MEETING")
          fi
          python tools/weekend_report.py --defer-auth --output-root reports "${args[@]}"
      - name: Install video renderer
        if: steps.collection.outputs.collected == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install -r tools/video-requirements.txt
      - name: Collect aligned race telemetry and render videos
        if: steps.collection.outputs.collected == 'true'
        env:
          OPENF1_CLIENT_ID: ${{ secrets.OPENF1_CLIENT_ID }}
          OPENF1_CLIENT_SECRET: ${{ secrets.OPENF1_CLIENT_SECRET }}
        run: python tools/report_video.py --root reports
      - name: Update cumulative year, Grand Prix and session archive
        if: steps.collection.outputs.collected == 'true'
        run: python tools/build_archive.py
      - name: Retain reports and snapshots for download
        if: always() && steps.collection.outputs.collected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f1-weekend-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit successfully generated reports
        if: steps.collection.outputs.collected == 'true'
        id: report_commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update F1 weekend reports'
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  claude-review:
    needs: report
    if: needs.report.outputs.generated == 'true'
    uses: ./.github/workflows/claude-report-review.yml
    with:
      artifact_name: f1-weekend-reports
      source_sha: ${{ needs.report.outputs.source_sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
