name: F1 weekend reports

on:
  # Runner-side restart gate keeps reports paused until the saved resume_at.
  # These UTC schedules cover only Friday-Monday in Asia/Seoul.
  # Each check reads checked-in files; collection APIs run only for due sessions.
  schedule:
    - cron: '7,22,37,52 15-23 * * 4'
    - cron: '7,22,37,52 * * * 5,6,0'
    - cron: '7,22,37,52 0-14 * * 1'
  workflow_dispatch:
    inputs:
      meeting:
        description: 'Optional OpenF1 meeting_key (blank = latest started weekend)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  report:
    outputs:
      source_sha: ${{ steps.report_commit.outputs.sha }}
      generated: ${{ steps.collection.outputs.collected }}
    concurrency:
      group: weekend-report
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.4
      - name: Check local schedule and OpenF1 recovery eligibility (no API calls)
        id: session_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPENF1_AUTH_CONFIGURED: ${{ secrets.OPENF1_CLIENT_ID != '' && secrets.OPENF1_CLIENT_SECRET != '' }}
          MEETING: ${{ inputs.meeting }}
        run: |
          args=()
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            args+=(--manual)
            if [ -n "$MEETING" ]; then
              [[ "$MEETING" =~ ^[0-9]+$ ]] || exit 1
              args+=(--meeting "$MEETING")
            fi
          fi
          python tools/session_report_schedule.py "${args[@]}"
      - name: Verify report generation and failure handling
        if: steps.session_gate.outputs.run == 'true'
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Install pinned FastF1 source
        if: steps.session_gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          git submodule update --init vendor/Fast-F1
          python -m pip install ./vendor/Fast-F1
      - name: Collect the listed sessions (all sessions on manual runs) and build report
        id: collection
        if: steps.session_gate.outputs.run == 'true'
        env:
          MEETING: ${{ steps.session_gate.outputs.meeting }}
          SESSIONS: ${{ steps.session_gate.outputs.sessions }}
          OPENF1_CLIENT_ID: ${{ secrets.OPENF1_CLIENT_ID }}
          OPENF1_CLIENT_SECRET: ${{ secrets.OPENF1_CLIENT_SECRET }}
        run: |
          args=()
          if [ -n "$MEETING" ]; then
            if ! [[ "$MEETING" =~ ^[0-9]+$ ]]; then
              echo 'meeting must be a numeric OpenF1 meeting_key'
              exit 1
            fi
            args+=(--meeting "$MEETING")
          fi
          if [ -n "$SESSIONS" ]; then
            if ! [[ "$SESSIONS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
              echo 'sessions must be comma-separated numeric session keys'
              exit 1
            fi
            args+=(--sessions "$SESSIONS")
          fi
          python tools/weekend_report.py --defer-auth --fastf1-fallback --output-root reports "${args[@]}"
      - name: Install video renderer
        if: steps.collection.outputs.collected == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install -r tools/video-requirements.txt
      - name: Collect race telemetry and practice / qualifying position replays
        if: steps.collection.outputs.collected == 'true'
        env:
          SESSIONS: ${{ steps.session_gate.outputs.sessions }}
          OPENF1_CLIENT_ID: ${{ secrets.OPENF1_CLIENT_ID }}
          OPENF1_CLIENT_SECRET: ${{ secrets.OPENF1_CLIENT_SECRET }}
        run: python tools/report_video.py --root reports --sessions "$SESSIONS"
      - name: Collect FastF1 supplementary timing and telemetry
        if: steps.collection.outputs.collected == 'true'
        env:
          SESSIONS: ${{ steps.session_gate.outputs.sessions }}
        run: python tools/fastf1_source.py --root reports --sessions "$SESSIONS"
      - name: Update cumulative year, Grand Prix and session archive
        if: steps.collection.outputs.collected == 'true'
        run: python tools/build_archive.py
      - name: Retain reports and snapshots for download
        if: always() && steps.collection.outputs.collected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f1-weekend-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit successfully generated reports
        if: steps.collection.outputs.collected == 'true'
        id: report_commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update F1 weekend reports'
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Save automatic attempt state only (no report update, review or delivery)
        # Unchanged data, HTTP 401, missing data or a failed run must still keep the
        # attempt so the next scheduled check does not query the same session again.
        # Collected data that is not committed here is marked not_published (not completed).
        if: always() && steps.session_gate.outputs.sessions != '' && steps.report_commit.outcome != 'success'
        env:
          SESSIONS: ${{ steps.session_gate.outputs.sessions }}
        run: |
          state=reports/catalog/report-attempts.json
          [ -f "$state" ] || exit 0
          cp "$state" "$RUNNER_TEMP/attempts-ours.json"
          git fetch -q origin "$GITHUB_REF_NAME"
          git reset -q --hard "origin/$GITHUB_REF_NAME"
          git clean -qfd -- reports
          git show "HEAD:$state" > "$RUNNER_TEMP/attempts-base.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/attempts-base.json"
          python tools/report_attempts.py --merge "$RUNNER_TEMP/attempts-base.json" "$RUNNER_TEMP/attempts-ours.json" --unpublished "$SESSIONS" --output "$state"
          git add -- "$state"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Record F1 automatic report attempts'
            git push || { git pull -q --rebase origin "$GITHUB_REF_NAME" && git push; }
          fi
  claude-review:
    needs: report
    if: needs.report.outputs.generated == 'true'
    uses: ./.github/workflows/claude-report-review.yml
    with:
      artifact_name: f1-weekend-reports
      source_sha: ${{ needs.report.outputs.source_sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  report-links:
    needs: [report, claude-review]
    if: always() && needs.report.outputs.generated == 'true' && needs.report.outputs.source_sha != ''
    runs-on: ubuntu-latest
    steps:
      - name: Publish report links in the workflow summary
        env:
          REVIEW_RESULT: ${{ needs.claude-review.result }}
        run: |
          {
            echo '## F1 보고서'
            echo ''
            echo ''
            echo '[누적 보고서](https://htmlpreview.github.io/?https://github.com/ckdtjs0911-glitch/Seony_F1/blob/main/reports/index.html)'
            echo ''
            echo '[HTML 파일과 세션 목록](https://github.com/ckdtjs0911-glitch/Seony_F1/tree/main/reports)'
            echo ''
            echo "Claude 작업 상태: $REVIEW_RESULT. 실제 첨삭·인증 결과는 Claude review artifact의 status.json을 확인하세요."
            echo '공개 링크는 main의 최신 파일을 표시합니다. 외부 미리보기 서비스이며 화면 렌더링 검증을 뜻하지 않습니다.'
          } >> "$GITHUB_STEP_SUMMARY"
